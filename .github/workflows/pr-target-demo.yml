name: PR Security - Target Demo

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

jobs:

  inspect-pr:

    runs-on: ubuntu-latest

    steps:

      - name: Display event information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"

      - name: Explain security context
        run: |
          echo "This workflow uses pull_request_target."
          echo "It runs in the base repository context."
          echo "Do NOT blindly execute PR code here."

      - name: Safe metadata operation
        run: |
          echo "Processing PR metadata only."
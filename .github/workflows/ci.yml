name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:

  # --------------------------------------------------
  # PREPARE JOB
  # --------------------------------------------------
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.build_info.outputs.version }}
      environment: ${{ steps.build_info.outputs.environment }}
      application: ${{ steps.build_info.outputs.application }}

    steps:
      - name: Generate build information
        id: build_info
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "environment=$APP_ENV" >> "$GITHUB_OUTPUT"
          echo "application=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Display generated information
        run: |
          echo "Application: ${{ steps.build_info.outputs.application }}"
          echo "Environment: ${{ steps.build_info.outputs.environment }}"
          echo "Version: ${{ steps.build_info.outputs.version }}"

  # --------------------------------------------------
  # TEST JOB
  # --------------------------------------------------
  test:
    needs: prepare
    runs-on: ubuntu-latest

    outputs:
      result: ${{ steps.test_result.outputs.result }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      # --------------------------------------------------
      # GITHUB_ENV PRACTICE
      # --------------------------------------------------
      - name: Generate build version
        run: |
          BUILD_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Verify build version
        run: |
          echo "Build version: $BUILD_VERSION"

      - name: Use build version again
        run: |
          echo "Preparing artifact for version: $BUILD_VERSION"

      # --------------------------------------------------
      # GITHUB_PATH PRACTICE
      # --------------------------------------------------
      - name: Create custom command
        run: |
          mkdir -p "$HOME/my-tools"

          cat > "$HOME/my-tools/hello-ci" << 'EOF'
          #!/bin/bash
          echo "Hello from a custom GitHub Actions command!"
          echo "This command is running from a directory added to PATH."
          EOF

          chmod +x "$HOME/my-tools/hello-ci"

      - name: Add custom directory to PATH
        run: |
          echo "$HOME/my-tools" >> "$GITHUB_PATH"

      - name: Run custom command
        run: |
          hello-ci

      # --------------------------------------------------
      # ANNOTATION PRACTICE
      # --------------------------------------------------
      - name: Create notice annotation
        run: echo "::notice::CI preparation completed successfully"

      - name: Create warning annotation
        run: echo "::warning::This is a practice warning"

      - name: Create error annotation
        run: echo "::error::This is a practice error annotation"

      # --------------------------------------------------
      # INSTALL AND TEST
      # --------------------------------------------------
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Display build information
        run: |
          echo "Application: ${{ needs.prepare.outputs.application }}"
          echo "Environment: ${{ needs.prepare.outputs.environment }}"
          echo "Version: ${{ needs.prepare.outputs.version }}"

      - name: Run tests
        run: python -m pytest

      - name: Generate test result
        id: test_result
        run: |
          echo "result=passed" >> "$GITHUB_OUTPUT"

      - name: Display test result
        run: |
          echo "Test result: ${{ steps.test_result.outputs.result }}"

      # --------------------------------------------------
      # CONFIGURATION AND GITHUB INFORMATION
      # --------------------------------------------------
      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Show GitHub information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      - name: Check branch
        run: |
          echo "Current ref: ${{ github.ref }}"
          echo "Is main branch: ${{ github.ref == 'refs/heads/main' }}"

      - name: Run only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Run only on feature branch
        if: github.ref != 'refs/heads/main'
        run: echo "This is not the main branch"

      - name: Always run this step
        run: echo "This step always runs"

      - name: Show GitHub ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      # --------------------------------------------------
      # JOB SUMMARY
      # --------------------------------------------------
      - name: Create CI job summary
        if: always()
        run: |
          echo "# CI Job Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Application:** ${{ needs.prepare.outputs.application }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ needs.prepare.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Test Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result:** ${{ steps.test_result.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## GitHub Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** $GITHUB_ACTOR" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------
  # APPLICATION JOB
  # --------------------------------------------------
  application:
    needs:
      - prepare
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display information from previous jobs
        run: |
          echo "Application: ${{ needs.prepare.outputs.application }}"
          echo "Environment: ${{ needs.prepare.outputs.environment }}"
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Test result: ${{ needs.test.outputs.result }}"

      - name: Verify test result
        if: needs.test.outputs.result == 'passed'
        run: echo "Tests passed. Application can proceed."

      - name: Run application
        run: python app.py

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

  # --------------------------------------------------
  # CONDITION PRACTICE
  # --------------------------------------------------
  condition-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Always available step
        run: echo "This step always runs"

      - name: Show ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Main branch step
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Feature branch step
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT the main branch"

      - name: Another normal step
        run: echo "Another normal step"

  # --------------------------------------------------
  # JOB CONDITION PRACTICE
  # --------------------------------------------------
  job-condition-practice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Job started
        run: echo "The entire job is running"

      - name: Second step
        run: echo "Second step is running"

  # --------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------
  reusable-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.13"
      environment: "testing"

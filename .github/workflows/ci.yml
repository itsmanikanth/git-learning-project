name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:

  # --------------------------------------------------
  # TEST JOB
  # --------------------------------------------------
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Show GitHub information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      - name: Check branch
        run: |
          echo "Current ref: ${{ github.ref }}"
          echo "Is main branch: ${{ github.ref == 'refs/heads/main' }}"

      - name: Run only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Run only on feature branch
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT the main branch"

      - name: Always run this step
        run: echo "This step always runs"

      - name: Show GitHub ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Check secret availability
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

  # --------------------------------------------------
  # APPLICATION JOB
  # --------------------------------------------------
  application:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run application
        run: python app.py

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

  # --------------------------------------------------
  # CONDITION PRACTICE
  # --------------------------------------------------
  condition-practice:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Always available step
        run: echo "This step always runs"

      - name: Show ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Main branch step
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Feature branch step
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT the main branch"

      - name: Another normal step
        run: echo "Another normal step"

  # --------------------------------------------------
  # JOB CONDITION PRACTICE
  # --------------------------------------------------
  job-condition-practice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Job started
        run: echo "The entire job is running"

      - name: Second step
        run: echo "Second step is running"

  # --------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------
  reusable-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.13"
      environment: "testing"

  # --------------------------------------------------
  # BUILD JOB
  # --------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir deployment-package
          cp app.py deployment-package/
          cp requirements.txt deployment-package/
          cp README.md deployment-package/

      - name: List deployment package
        run: |
          echo "Deployment package contents:"
          ls -la deployment-package

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: deployment-package/

  # --------------------------------------------------
  # STAGING DEPLOYMENT
  # --------------------------------------------------
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: staging

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: application-package
          path: deployment-package

      - name: Show downloaded package
        run: |
          echo "Downloaded deployment package:"
          ls -la deployment-package

      - name: Simulate staging deployment
        run: |
          echo "Deploying application to staging..."
          echo "Deployment successful."
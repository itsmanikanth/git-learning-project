name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

env:
  APP_NAME: "Git Learning Project"


jobs:

  # --------------------------------------------------
  # TEST JOB
  # --------------------------------------------------

  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      test_result: ${{ steps.test-result.outputs.result }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug environment
        run: |
          echo "Debugging workflow execution"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Current directory:"
          pwd
          echo "Python location:"
          which python
          echo "Python version:"
          python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        id: run-tests
        run: |
          echo "Running tests..."
          echo "Tests passed."

      - name: Set test result
        id: test-result
        run: |
          echo "result=passed" >> "$GITHUB_OUTPUT"


  # --------------------------------------------------
  # OIDC DEMONSTRATION JOB
  # --------------------------------------------------

  oidc-demo:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    needs:
      - test

    steps:

      - name: Display OIDC configuration
        run: |
          echo "OIDC demonstration"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

      - name: Explain OIDC permission
        run: |
          echo "id-token: write is enabled."
          echo "This allows the workflow to request an OIDC identity token."
          echo "It does NOT grant repository write access."

      - name: Display test result
        run: |
          echo "Test result: ${{ needs.test.outputs.test_result }}"


  # --------------------------------------------------
  # APPLICATION JOB
  # --------------------------------------------------

  application:

    runs-on: ubuntu-latest

    needs:
      - test
      - oidc-demo

    permissions:
      contents: read

    steps:

      - name: Application stage
        run: |
          echo "Application stage started."
          echo "Application: $APP_NAME"
          echo "Test result: ${{ needs.test.outputs.test_result }}"


  # --------------------------------------------------
  # STAGING DEPLOYMENT
  # --------------------------------------------------

  deploy-staging:

    runs-on: ubuntu-latest

    needs:
      - application

    environment:
      name: staging

    permissions:
      contents: read

    steps:

      - name: Deploy to staging
        run: |
          echo "Environment: staging"
          echo "Deployment branch: $GITHUB_REF"
          echo "Simulating staging deployment..."


  # --------------------------------------------------
  # PRODUCTION DEPLOYMENT
  # --------------------------------------------------

  deploy-production:

    runs-on: ubuntu-latest

    needs:
      - deploy-staging

    environment:
      name: production

    permissions:
      contents: read

    steps:

      - name: Deploy to production
        run: |
          echo "Environment: production"
          echo "Deployment branch: $GITHUB_REF"
          echo "Production deployment approved."
          echo "Simulating production deployment..."


  # --------------------------------------------------
  # FINAL WORKFLOW DEBUGGING PRACTICE
  # --------------------------------------------------

  final-debug:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create build output
        run: |
          echo "Building application..."
          mkdir -p build
          echo "Application build successful." > build/application.txt

          echo "Build output created:"
          ls -la build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: dist/application.txt

      - name: Diagnose failure
        if: failure()
        run: |
          echo "======================================"
          echo "WORKFLOW FAILURE DIAGNOSTICS"
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Top-level files:"
          ls -la

          echo ""
          echo "Build directory:"
          ls -la build || true

          echo ""
          echo "Dist directory:"
          ls -la dist || true

          echo ""
          echo "Searching for application.txt:"
          find . -name "application.txt" -type f -print

          echo ""
          echo "Git status:"
          git status

          echo ""
          echo "Diagnostic conclusion:"
          echo "The expected artifact path does not match the actual build output path."


      - name: Debug summary
        if: always()
        run: |
          echo "Final debugging exercise completed."
          echo "Review the failed upload step and diagnostic output."
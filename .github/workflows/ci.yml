name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # TEST JOB
  # --------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Show GitHub information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      - name: Check branch
        run: |
          echo "Current ref: ${{ github.ref }}"
          echo "Is main branch: ${{ github.ref == 'refs/heads/main' }}"

      - name: Run only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Run only on feature branch
        if: github.ref != 'refs/heads/main'
        run: echo "This is not the main branch"

      - name: Always run this step
        run: echo "This step always runs"

      - name: Show GitHub ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Check secret availability
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

  # --------------------------------------------------
  # APPLICATION JOB
  # --------------------------------------------------
  application:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run application
        run: python app.py

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

  # --------------------------------------------------
  # CONDITION PRACTICE
  # --------------------------------------------------
  condition-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Always available step
        run: echo "This step always runs"

      - name: Show ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Main branch step
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Feature branch step
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT the main branch"

      - name: Another normal step
        run: echo "Another normal step"

  # --------------------------------------------------
  # JOB CONDITION PRACTICE
  # --------------------------------------------------
  job-condition-practice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Job started
        run: echo "The entire job is running"

      - name: Second step
        run: echo "Second step is running"

  # --------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------
  reusable-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.13"
      environment: "testing"
    secrets:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

  # --------------------------------------------------
  # GITHUB TOKEN PRACTICE
  # --------------------------------------------------
  github-token-practice:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check GITHUB_TOKEN availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "GITHUB_TOKEN is available"
          else
            echo "GITHUB_TOKEN is missing"
            exit 1
          fi

      - name: Show token permission model
        run: |
          echo "GITHUB_TOKEN is automatically provided by GitHub Actions."
          echo "Repository contents permission: read"

      - name: Check repository using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo view "$GITHUB_REPOSITORY" \
            --json name,owner \
            --jq '"Repository: \(.owner.login)/\(.name)"'

  # --------------------------------------------------
  # PRODUCTION ENVIRONMENT PROTECTION PRACTICE
  # --------------------------------------------------
  production-protection-practice:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Show environment
        run: |
          echo "Environment: production"
          echo "Deployment branch: ${{ github.ref_name }}"

      - name: Simulate deployment
        run: |
          echo "Production deployment approved."
          echo "Simulating production deployment..."
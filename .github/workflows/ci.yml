```yaml
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:

  # --------------------------------------------------
  # TEST JOB
  # --------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # --------------------------------------------------
      # CONCURRENCY PRACTICE
      # --------------------------------------------------
      - name: Simulate long-running job
        run: |
          echo "Long-running job started"
          sleep 90
          echo "Long-running job completed"

      - name: Run tests
        run: python -m pytest

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Show GitHub information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      - name: Check branch
        run: |
          echo "Current ref: ${{ github.ref }}"
          echo "Is main branch: ${{ github.ref == 'refs/heads/main' }}"

      - name: Run only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Run only on feature branch
        if: github.ref != 'refs/heads/main'
        run: echo "This is not the main branch"

      - name: Always run this step
        run: echo "This step always runs"

      - name: Show GitHub ref
        run: echo "GITHUB_REF=$GITHUB_REF"

  # --------------------------------------------------
  # APPLICATION JOB
  # --------------------------------------------------
  application:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run application
        run: python app.py

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

  # --------------------------------------------------
  # CONDITION PRACTICE
  # --------------------------------------------------
  condition-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Always available step
        run: echo "This step always runs"

      - name: Show ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Main branch step
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Feature branch step
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT the main branch"

      - name: Another normal step
        run: echo "Another normal step"

  # --------------------------------------------------
  # JOB CONDITION PRACTICE
  # --------------------------------------------------
  job-condition-practice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Job started
        run: echo "The entire job is running"

      - name: Second step
        run: echo "Second step is running"

  # --------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------
  reusable-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.13"
      environment: "testing"
```
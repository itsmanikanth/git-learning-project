name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Create test report
        run: |
          echo "CI Test Report" > test-report.txt
          echo "All tests passed" >> test-report.txt
          echo "Repository: $GITHUB_REPOSITORY" >> test-report.txt
          echo "Commit: $GITHUB_SHA" >> test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-report
          path: test-report.txt
          retention-days: 7

  report:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: ci-test-report

      - name: Display test report
        run: cat test-report.txt

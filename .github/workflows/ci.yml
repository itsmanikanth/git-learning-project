
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:

  # --------------------------------------------------
  # TEST JOB
  # --------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Show GitHub information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      - name: Check branch
        run: |
          echo "Current ref: ${{ github.ref }}"
          echo "Is main branch: ${{ github.ref == 'refs/heads/main' }}"

      - name: Run only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Run only on feature branch
        if: github.ref != 'refs/heads/main'
        run: echo "This is not the main branch"

      - name: Always run this step
        run: echo "This step always runs"

      - name: Show GitHub ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      # --------------------------------------------------
      # GITHUB_STEP_SUMMARY
      # --------------------------------------------------
      - name: Create CI job summary
        if: always()
        run: |
          echo "# 🚀 CI Job Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Application" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Name:** $APP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** $APP_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## GitHub Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** $GITHUB_ACTOR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Result" >> "$GITHUB_STEP_SUMMARY"
          echo "CI workflow completed." >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # GITHUB_OUTPUT PRACTICE
      # --------------------------------------------------
      - name: Generate build information
        id: build_info
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "environment=$APP_ENV" >> "$GITHUB_OUTPUT"
          echo "application=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Display build information
        run: |
          echo "Application: ${{ steps.build_info.outputs.application }}"
          echo "Environment: ${{ steps.build_info.outputs.environment }}"
          echo "Version: ${{ steps.build_info.outputs.version }}"

  # --------------------------------------------------
  # APPLICATION JOB
  # --------------------------------------------------
  application:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run application
        run: python app.py

      - name: Show configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"

  # --------------------------------------------------
  # CONDITION PRACTICE
  # --------------------------------------------------
  condition-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Always available step
        run: echo "This step always runs"

      - name: Show ref
        run: echo "GITHUB_REF=$GITHUB_REF"

      - name: Main branch step
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Feature branch step
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT the main branch"

      - name: Another normal step
        run: echo "Another normal step"

  # --------------------------------------------------
  # JOB CONDITION PRACTICE
  # --------------------------------------------------
  job-condition-practice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Job started
        run: echo "The entire job is running"

      - name: Second step
        run: echo "Second step is running"

  # --------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------
  reusable-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.13"
      environment: "testing"

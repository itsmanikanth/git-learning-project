name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ENV: ${{ vars.APP_ENV }}
  APP_NAME: ${{ vars.APP_NAME }}

# ==================================================
# DEFAULT / WORKFLOW-LEVEL PERMISSIONS
# ==================================================
# All jobs get READ access by default.
# Individual jobs can request additional permissions
# only when they actually need them.
# ==================================================
permissions:
  contents: read

jobs:

  # ==================================================
  # PREPARE
  # ==================================================
  prepare:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.build_info.outputs.version }}
      environment: ${{ steps.build_info.outputs.environment }}
      application: ${{ steps.build_info.outputs.application }}

    steps:

      - name: Generate build information
        id: build_info
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "environment=$APP_ENV" >> "$GITHUB_OUTPUT"
          echo "application=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Display generated information
        run: |
          echo "Application: ${{ steps.build_info.outputs.application }}"
          echo "Environment: ${{ steps.build_info.outputs.environment }}"
          echo "Version: ${{ steps.build_info.outputs.version }}"


  # ==================================================
  # TEST
  # ==================================================
  test:

    needs: prepare

    runs-on: ubuntu-latest

    outputs:
      result: ${{ steps.test_result.outputs.result }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: |
          python --version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Generate test result
        id: test_result
        run: |
          echo "result=passed" >> "$GITHUB_OUTPUT"

      - name: Display test result
        run: |
          echo "Test result: ${{ steps.test_result.outputs.result }}"

      - name: Create CI summary
        if: always()
        run: |
          echo "# CI Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application: ${{ needs.prepare.outputs.application }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ needs.prepare.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test result: ${{ steps.test_result.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"


  # ==================================================
  # MATRIX TEST
  # ==================================================
  matrix-strategy-practice:

    strategy:

      fail-fast: false

      max-parallel: 2

      matrix:

        python-version:
          - "3.11"
          - "3.12"

        os:
          - ubuntu-latest
          - windows-latest

        include:

          - python-version: "3.13"
            os: ubuntu-latest
            experimental: true

        exclude:

          - python-version: "3.11"
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Display matrix combination
        shell: bash
        run: |
          echo "Operating system: ${{ matrix.os }}"
          echo "Python version: ${{ matrix.python-version }}"
          echo "Experimental: ${{ matrix.experimental }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python version
        shell: bash
        run: |
          python --version

      - name: Run matrix test
        shell: bash
        run: |
          echo "Testing Python ${{ matrix.python-version }}"
          echo "Operating system: ${{ matrix.os }}"

      - name: Handle experimental configuration
        if: matrix.experimental == true
        shell: bash
        run: |
          echo "Experimental configuration detected."

      - name: Handle normal configuration
        if: matrix.experimental != true
        shell: bash
        run: |
          echo "Normal configuration detected."


  # ==================================================
  # APPLICATION
  # ==================================================
  application:

    needs:
      - prepare
      - test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display previous job outputs
        run: |
          echo "Application: ${{ needs.prepare.outputs.application }}"
          echo "Environment: ${{ needs.prepare.outputs.environment }}"
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Test result: ${{ needs.test.outputs.result }}"

      - name: Verify test result
        if: needs.test.outputs.result == 'passed'
        run: |
          echo "Tests passed. Application can proceed."

      - name: Run application
        run: |
          python app.py


  # ==================================================
  # CONDITION PRACTICE
  # ==================================================
  condition-practice:

    runs-on: ubuntu-latest

    steps:

      - name: Always available step
        run: |
          echo "This step always runs"

      - name: Show ref
        run: |
          echo "GITHUB_REF=$GITHUB_REF"

      - name: Main branch step
        if: github.ref == 'refs/heads/main'
        run: |
          echo "This is the main branch"

      - name: Feature branch step
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This is NOT the main branch"


  # ==================================================
  # JOB CONDITION
  # ==================================================
  job-condition-practice:

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Job started
        run: |
          echo "The entire job is running"

      - name: Second step
        run: |
          echo "Second step is running"


  # ==================================================
  # REUSABLE WORKFLOW
  # ==================================================
  reusable-test:

    uses: ./.github/workflows/reusable-test.yml

    with:
      python-version: "3.13"
      environment: "testing"


  # ==================================================
  # SECURITY JOB
  # ==================================================
  security-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security check
        run: |
          echo "Security job has READ access."
          echo "It does not require repository WRITE access."


  # ==================================================
  # RELEASE JOB
  # ==================================================
  # IMPORTANT:
  # This job deliberately receives WRITE permission.
  #
  # The workflow default is:
  #
  #     contents: read
  #
  # But this job overrides that with:
  #
  #     contents: write
  #
  # This demonstrates job-level permissions.
  # ==================================================
  release:

    needs:
      - prepare
      - test

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display release permission
        run: |
          echo "Release job has contents: write permission."
          echo "This job is the only job in this workflow that requires WRITE access."

      - name: Prepare release information
        run: |
          echo "Application: ${{ needs.prepare.outputs.application }}"
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Test result: ${{ needs.test.outputs.result }}"

      - name: Simulate release
        run: |
          echo "Simulating release operation..."
          echo "A real release could create a tag or GitHub release."

